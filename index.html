A expansão portuguesa começou pela exploração da costa da África. Portugal passou a avançar gradualmente pelo litoral africano, buscando novas terras, riquezas e principalmente uma passagem marítima para chegar ao Oriente.

Navegação de cabotagem:
Consiste em navegar mantendo-se próximo à costa. Isso era importante porque os navegadores ainda não possuíam conhecimento suficiente para realizar longas viagens em mar aberto com segurança. Assim, exploravam a costa aos poucos, reconhecendo novos territórios e criando mapas.`,

              body: `O DNA é a molécula que armazena as informações genéticas. Essas informações precisam ser utilizadas para produzir proteínas.

A relação pode ser entendida assim:
DNA → RNA → PROTEÍNA

O DNA contém a informação, o RNA leva essa informação até o local de produção e a proteína é formada a partir dela.

Como essa informação funciona?
O DNA possui bases nitrogenadas:
A = Adenina
T = Timina
C = Citosina
G = Guanina

No RNA, a Timina (T) é substituída pela Uracila (U):
A = Adenina
U = Uracila
C = Citosina
G = Guanina

Durante a formação do RNA, ocorre o pareamento das bases:
DNA → RNA
A → U
T → A
C → G
G → C`,

Um conjunto de 3 bases do RNA mensageiro (RNAm) é chamado de códon.
3 bases → 1 códon → 1 aminoácido

Os aminoácidos são as unidades que se juntam para formar uma proteína.

Exemplo:
RNAm: AUG → determina o aminoácido Metionina (MET)
RNAm: GUC → determina o aminoácido Valina (VAL)

Portanto, a sequência de códons do RNAm determina a sequência de aminoácidos da proteína.`,

1ª etapa — Transcrição
A transcrição acontece no núcleo.
Nessa etapa, uma parte do DNA serve como molde para produzir uma molécula de RNA mensageiro (RNAm).
DNA → RNAm
O RNAm é como uma cópia da informação do DNA que poderá sair do núcleo.

2ª etapa — Tradução
A tradução acontece no citoplasma, nos ribossomos.
O RNAm chega ao ribossomo e seus códons são lidos.
O RNA transportador (RNAt) possui um anticódon, que se liga ao códon correspondente do RNAm, trazendo o aminoácido correto.
Assim: RNAm → códons → RNAt → aminoácidos → proteína`,

              body: `Podemos representar uma função como: f: A → B

Onde:
A é o conjunto de partida.
B é o conjunto de chegada.
x representa o elemento que entra na função.
y representa o resultado obtido pela função.

Portanto: f(x) = y

A ideia principal é: x → f(x) → y

Cada valor de x deve possuir um único valor correspondente de y.`,

Em outras palavras: f(x) = 0

Exemplo:
f(x) = 2x - 6

Para encontrar a raiz:
f(x) = 0
2x - 6 = 0
2x = 6
x = 6/2
x = 3

Portanto: x = 3 é a raiz da função.

O que significa a raiz?
A raiz é o ponto em que o gráfico da função toca ou cruza o eixo x, pois nesse ponto: y = 0`,

Domínio (D)
O domínio é o conjunto formado pelos valores que podem entrar na função, ou seja, os valores de x.
No exemplo: D(f) = {1, 2, 3}
Domínio → valores de x

Contradomínio (CD)
O contradomínio é o conjunto de valores que podem receber os resultados da função.
No exemplo: CD(f) = {3, 4, 5, 6}
Contradomínio → conjunto B
Importante: nem todos os elementos do contradomínio precisam necessariamente receber uma seta.

Imagem (Im)
A imagem é o conjunto dos valores que realmente são obtidos pela função.
Como: 1 → 3, 2 → 4, 3 → 5
Temos: Im(f) = {3, 4, 5}
O número 6 não pertence à imagem porque nenhum elemento do domínio foi associado a ele.

Resumindo:
Domínio: valores que entram → x
Contradomínio: conjunto onde os resultados podem estar
Imagem: valores que realmente saem → y

No exemplo:
D(f) = {1, 2, 3}
CD(f) = {3, 4, 5, 6}

Na representação gráfica, podemos considerar dois pontos:
A = (xₐ, yₐ)
B = (xᵦ, yᵦ)

A fórmula é: tg α = (yᵦ - yₐ) / (xᵦ - xₐ)
Também podemos escrever: tg α = Δy / Δx
Onde: Δy = yᵦ - yₐ e Δx = xᵦ - xₐ

Como entender isso?
Δy → quanto o valor de y mudou.
Δx → quanto o valor de x mudou.
A razão Δy/Δx mostra a variação de y para cada variação de x.

Essa taxa está relacionada à inclinação da reta.`,

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
const app = document.getElementById("app");
const breadcrumb = document.getElementById("breadcrumb");

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function findSubject(id) {
  return DB.subjects.find((s) => s.id === id);
}
function findContent(subjectId, contentId) {
  const subject = findSubject(subjectId);
  if (!subject) return null;
  return subject.contents.find((c) => c.id === contentId);
}

/* ============================================================
   ROTEADOR (baseado em hash, sem recarregar a página)
   ============================================================ */
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "");
  const parts = raw.split("/").filter(Boolean);
  if (parts.length === 0 || parts[0] === "home") return { view: "home" };
  if (parts[0] === "materia" && parts[1]) {
    if (parts[2] === "conteudo" && parts[3]) {
      return { view: "content", subjectId: parts[1], contentId: parts[3] };
    }
    return { view: "subject", subjectId: parts[1] };
  }
  return { view: "home" };
}

function navigate(hash) {
  location.hash = hash;
}

function router() {
  const route = parseHash();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });

  if (route.view === "home") return renderHome();
  if (route.view === "subject") return renderSubjectPage(route.subjectId);
  if (route.view === "content") return renderContentPage(route.subjectId, route.contentId);
  renderHome();
}
window.addEventListener("hashchange", router);

/* ============================================================
   RENDER: HOME
   ============================================================ */
function renderHome() {
  breadcrumb.innerHTML = "";
  app.innerHTML = "";
  app.classList.add("fade-in");

  const hero = el(`
    <section class="mb-10 sm:mb-14">
      <p class="uppercase tracking-[0.2em] text-xs font-semibold text-ochre mb-3">Painel de estudos</p>
      <h1 class="font-display text-3xl sm:text-5xl leading-tight text-espresso mb-3">
        Tudo o que você precisa revisar, em um só lugar.
      </h1>
      <p class="text-bark/70 max-w-xl leading-relaxed">
        Escolha uma matéria abaixo para acessar os conteúdos e treinar com os quizzes de revisão.
      </p>
    </section>
  `);
  app.appendChild(hero);

  if (DB.subjects.length === 0) {
    app.appendChild(el(`
      <section class="rounded-card border border-dashed border-sand bg-beige/40 px-6 py-14 text-center">
        <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-sand/50 flex items-center justify-center text-2xl">📚</div>

          eles vão aparecer nesta tela, organizados em cartões como este.
        </p>
      </section>
    `));

  }

  const grid = el(`<section class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5"></section>`);
  DB.subjects.forEach((subject) => {
    const card = el(`
      <a href="#/materia/${subject.id}"
         class="card-hover group block rounded-card bg-white/60 border border-sand/70 p-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <span class="text-3xl">${subject.emoji || "📘"}</span>

/* ============================================================

  app.innerHTML = "";

      secEl.querySelector(".visual-wrap").innerHTML = sec.visual;
    }
    sectionsWrap.appendChild(secEl);
  });
  app.appendChild(sectionsWrap);

  app.appendChild(renderQuizSection(content.quiz, { noShuffle: content.noShuffle }));

  if (content.extraQuiz && content.extraQuiz.length) {
    app.appendChild(
      renderQuizSection(content.extraQuiz, {
        noShuffle: content.noShuffle,
        label: content.extraQuizLabel || "Questões extras",

}

function backLink(href = "#home", label = "Voltar ao início") {

    <a href="${href}" class="inline-flex items-center gap-2 text-sm font-medium text-bark/70 hover:text-ochre transition-colors">

    </a>
  `);
}

/* ============================================================
   ENGINE DO QUIZ (Treino) — 10 perguntas, 1 tentativa cada
   ============================================================ */
function shuffleArray(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleQuestions(questions, noShuffle) {
  if (noShuffle) return questions.slice();
  return shuffleArray(questions).map((question) => {
    const order = shuffleArray(question.options.map((_, i) => i));
    return {
      q: question.q,
      options: order.map((i) => question.options[i]),
      correct: order.indexOf(question.correct),
    };
  });
}

function renderQuizSection(questions, opts = {}) {
  const originalQuestions = questions || [];
  const label = opts.label || "Treino";
  const heading = opts.heading || "Teste o que você aprendeu";
  const noShuffle = !!opts.noShuffle;

  const section = el(`
    <section class="rounded-card bg-espresso text-cream p-6 sm:p-8">
      <p class="uppercase tracking-[0.2em] text-xs font-semibold text-sand mb-1">${label}</p>
      <h2 class="font-display text-2xl mb-1">${heading}</h2>
      <p class="quiz-meta text-cream/60 text-sm mb-6"></p>
      <div class="quiz-list space-y-4"></div>
      <div class="quiz-score mt-8 hidden rounded-card bg-cream/10 border border-cream/20 px-5 py-4 text-center"></div>
    </section>
  `);

  const list = section.querySelector(".quiz-list");
  const scoreBox = section.querySelector(".quiz-score");
  const meta = section.querySelector(".quiz-meta");

  function startRound() {
    list.innerHTML = "";
    scoreBox.classList.add("hidden");
    scoreBox.innerHTML = "";

    if (originalQuestions.length === 0) {
      meta.textContent = "";
      list.appendChild(el(`<p class="text-cream/60 text-sm">O treino deste conteúdo ainda será adicionado.</p>`));
      return;
    }

    const questions = shuffleQuestions(originalQuestions, noShuffle);
    const orderNote = noShuffle ? "" : " · ordem embaralhada a cada tentativa";
    meta.textContent = `${questions.length} pergunta${questions.length === 1 ? "" : "s"} · uma tentativa por pergunta${orderNote}`;

    let answered = 0;
    let correctCount = 0;

    questions.forEach((question, qIndex) => {
      const qCard = el(`

        <div class="rounded-card bg-cream/5 border border-cream/15 p-5">
          <p class="font-medium mb-4 leading-snug">${qIndex + 1}. ${question.q}</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 opts"></div>
          <p class="feedback mt-3 text-sm font-medium hidden"></p>
        </div>
      `);
      const optsWrap = qCard.querySelector(".opts");
      const feedback = qCard.querySelector(".feedback");
      let locked = false;

      question.options.forEach((optionText, optIndex) => {
        const btn = el(`
          <button type="button"
            class="quiz-option text-left px-4 py-3 rounded-xl border border-cream/25 bg-transparent hover:bg-cream/10 text-sm">
            ${optionText}
          </button>
        `);
        btn.addEventListener("click", () => {
          if (locked) return;
          locked = true;
          answered++;

          const isCorrect = optIndex === question.correct;
          if (isCorrect) correctCount++;

          [...optsWrap.children].forEach((b, i) => {
            b.classList.remove("hover:bg-cream/10");
            b.disabled = true;
            if (i === question.correct) {
              b.classList.add("bg-correct/80", "border-correct", "text-cream");
            } else if (i === optIndex && !isCorrect) {
              b.classList.add("bg-wrong/80", "border-wrong", "text-cream");
            } else {
              b.classList.add("opacity-50");
            }
          });

          feedback.classList.remove("hidden");
          feedback.textContent = isCorrect
            ? "Certo! Boa."
            : `Errado. A resposta correta é: ${question.options[question.correct]}`;
          feedback.classList.add(isCorrect ? "text-correct" : "text-wrong");

          if (answered === questions.length) {
            scoreBox.classList.remove("hidden");
            scoreBox.innerHTML = `
              <p class="font-display text-xl">${correctCount} de ${questions.length} corretas</p>
              <p class="text-cream/60 text-sm mt-1">Revise o conteúdo acima nos pontos que errou.</p>
              <button type="button" class="restart-btn mt-4 inline-flex items-center gap-2 rounded-full bg-cream text-espresso text-sm font-semibold px-5 py-2.5 hover:bg-sand transition-colors">
                ↺ Recomeçar treino
              </button>
            `;
            scoreBox.querySelector(".restart-btn").addEventListener("click", startRound);
          }
        });
        optsWrap.appendChild(btn);
      });

      list.appendChild(qCard);
    });
  }

  startRound();
  return section;
}
