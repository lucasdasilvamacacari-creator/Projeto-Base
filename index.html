/* ============================================================
   UTILITÁRIOS
   ============================================================ */
const app = document.getElementById("app");
const breadcrumb = document.getElementById("breadcrumb");

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function findSubject(id) {
  return DB.subjects.find((s) => s.id === id);
}
function findContent(subjectId, contentId) {
  const subject = findSubject(subjectId);
  if (!subject) return null;
  return subject.contents.find((c) => c.id === contentId);
}

/* ============================================================
   ROTEADOR (baseado em hash, sem recarregar a página)
   ============================================================ */
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "");
  const parts = raw.split("/").filter(Boolean);
  if (parts.length === 0 || parts[0] === "home") return { view: "home" };
  if (parts[0] === "materia" && parts[1]) {
    if (parts[2] === "conteudo" && parts[3]) {
      return { view: "content", subjectId: parts[1], contentId: parts[3] };
    }
    return { view: "subject", subjectId: parts[1] };
  }
  return { view: "home" };
}

function navigate(hash) {
  location.hash = hash;
}

function router() {
  const route = parseHash();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });

  if (route.view === "home") return renderHome();
  if (route.view === "subject") return renderSubjectPage(route.subjectId);
  if (route.view === "content") return renderContentPage(route.subjectId, route.contentId);
  renderHome();
}
window.addEventListener("hashchange", router);

/* ============================================================
   RENDER: HOME
   ============================================================ */
function renderHome() {
  breadcrumb.innerHTML = "";
  app.innerHTML = "";
  app.classList.add("fade-in");

  const hero = el(`
    <section class="mb-10 sm:mb-14">
      <p class="uppercase tracking-[0.2em] text-xs font-semibold text-ochre mb-3">Painel de estudos</p>
      <h1 class="font-display text-3xl sm:text-5xl leading-tight text-espresso mb-3">
        Tudo o que você precisa revisar, em um só lugar.
      </h1>
      <p class="text-bark/70 max-w-xl leading-relaxed">
        Escolha uma matéria abaixo para acessar os conteúdos e treinar com os quizzes de revisão.
      </p>
    </section>
  `);
  app.appendChild(hero);

  if (DB.subjects.length === 0) {
    app.appendChild(el(`
      <section class="rounded-card border border-dashed border-sand bg-beige/40 px-6 py-14 text-center">
        <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-sand/50 flex items-center justify-center text-2xl">📚</div>
        <h2 class="font-display text-xl text-espresso mb-2">Nenhuma matéria por aqui ainda</h2>
        <p class="text-bark/60 max-w-md mx-auto leading-relaxed text-sm">
          Assim que a primeira matéria e o primeiro conteúdo forem enviados,
          eles vão aparecer nesta tela, organizados em cartões como este.
        </p>
      </section>
    `));
    return;
  }

  const grid = el(`<section class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5"></section>`);
  DB.subjects.forEach((subject) => {
    const card = el(`
      <a href="#/materia/${subject.id}"
         class="card-hover group block rounded-card bg-white/60 border border-sand/70 p-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <span class="text-3xl">${subject.emoji || "📘"}</span>
          <span class="text-bark/40 group-hover:text-ochre transition-colors text-lg">→</span>
        </div>
        <h3 class="font-display text-xl text-espresso mb-1">${subject.name}</h3>
        <p class="text-sm text-bark/60">${subject.contents.length} conteúdo${subject.contents.length === 1 ? "" : "s"}</p>
      </a>
    `);
    grid.appendChild(card);
  });
  app.appendChild(grid);
}

/* ============================================================

   ============================================================ */

  }

  breadcrumb.innerHTML = `
    <a href="#home" class="hover:text-ochre transition-colors">Início</a>
    <span class="text-bark/30">/</span>
    <span class="text-espresso">${subject.name}</span>
  `;

  app.appendChild(backLink());

  const header = el(`
    <section class="mt-6 mb-8 sm:mb-10 flex items-center gap-4">
      <span class="text-4xl">${subject.emoji || "📘"}</span>
      <div>
        <p class="uppercase tracking-[0.2em] text-xs font-semibold text-ochre mb-1">Matéria</p>
        <h1 class="font-display text-2xl sm:text-4xl text-espresso">${subject.name}</h1>
      </div>
    </section>
  `);
  app.appendChild(header);

  const grid = el(`<section class="grid grid-cols-1 sm:grid-cols-2 gap-4"></section>`);
  subject.contents.forEach((content) => {
    const card = el(`
      <a href="#/materia/${subject.id}/conteudo/${content.id}"
         class="card-hover group block rounded-card bg-white/60 border border-sand/70 p-5 shadow-sm">
        <h3 class="font-display text-lg text-espresso mb-1">${content.title}</h3>
        <p class="text-sm text-bark/60">Ver conteúdo e treinar →</p>
      </a>
    `);
    grid.appendChild(card);
  });
  app.appendChild(grid);
}

/* ============================================================
   RENDER: PÁGINA DE CONTEÚDO + TREINO (QUIZ)
   ============================================================ */
function renderContentPage(subjectId, contentId) {
  const subject = findSubject(subjectId);
  const content = findContent(subjectId, contentId);
  app.innerHTML = "";
  app.classList.add("fade-in");

  if (!subject || !content) {
    app.appendChild(backLink());
    app.appendChild(el(`<p class="text-bark/60 mt-6">Conteúdo não encontrado.</p>`));
    return;
  }

  breadcrumb.innerHTML = `
    <a href="#home" class="hover:text-ochre transition-colors">Início</a>
    <span class="text-bark/30">/</span>
    <a href="#/materia/${subject.id}" class="hover:text-ochre transition-colors">${subject.name}</a>
    <span class="text-bark/30">/</span>
    <span class="text-espresso">${content.title}</span>
  `;

  app.appendChild(backLink(`#/materia/${subject.id}`, `Voltar para ${subject.name}`));

  const header = el(`
    <section class="mt-6 mb-8">
      <p class="uppercase tracking-[0.2em] text-xs font-semibold text-ochre mb-2">${subject.name}</p>
      <h1 class="font-display text-2xl sm:text-4xl text-espresso">${content.title}</h1>
    </section>
  `);
  app.appendChild(header);

  const sectionsWrap = el(`<article class="space-y-6 mb-14"></article>`);
  (content.sections || []).forEach((sec) => {
    const secEl = el(`
      <div class="rounded-card bg-white/60 border border-sand/70 p-6 shadow-sm">
        ${sec.heading ? `<h2 class="font-display text-lg text-espresso mb-2">${sec.heading}</h2>` : ""}
        <div class="body-text text-bark/80 leading-relaxed whitespace-pre-line text-[15px]"></div>
        ${sec.visual ? `<div class="visual-wrap mt-5 rounded-xl bg-beige/40 border border-sand/50 p-4"></div>` : ""}
      </div>
    `);
    secEl.querySelector(".body-text").textContent = sec.body || "";
    if (sec.visual) {
      secEl.querySelector(".visual-wrap").innerHTML = sec.visual;
    }
    sectionsWrap.appendChild(secEl);
  });
  app.appendChild(sectionsWrap);

  app.appendChild(renderQuizSection(content));
}

function backLink(href = "#home", label = "Voltar ao início") {
  return el(`
    <a href="${href}" class="inline-flex items-center gap-2 text-sm font-medium text-bark/70 hover:text-ochre transition-colors">
      <span aria-hidden="true">←</span> ${label}
    </a>
  `);
}

/* ============================================================
   ENGINE DO QUIZ (Treino) — 10 perguntas, 1 tentativa cada
   ============================================================ */
function renderQuizSection(content) {
  const questions = content.quiz || [];

  const section = el(`
    <section class="rounded-card bg-espresso text-cream p-6 sm:p-8">
      <p class="uppercase tracking-[0.2em] text-xs font-semibold text-sand mb-1">Treino</p>
      <h2 class="font-display text-2xl mb-1">Teste o que você aprendeu</h2>
      <p class="text-cream/60 text-sm mb-6">
        ${questions.length} pergunta${questions.length === 1 ? "" : "s"} · uma tentativa por pergunta
      </p>
      <div class="quiz-list space-y-4"></div>
      <div class="quiz-score mt-8 hidden rounded-card bg-cream/10 border border-cream/20 px-5 py-4 text-center"></div>
    </section>
  `);

  const list = section.querySelector(".quiz-list");
  const scoreBox = section.querySelector(".quiz-score");
  let answered = 0;
  let correctCount = 0;

  questions.forEach((question, qIndex) => {
    const qCard = el(`
      <div class="rounded-card bg-cream/5 border border-cream/15 p-5">
        <p class="font-medium mb-4 leading-snug">${qIndex + 1}. ${question.q}</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 opts"></div>
        <p class="feedback mt-3 text-sm font-medium hidden"></p>
      </div>
    `);
    const optsWrap = qCard.querySelector(".opts");
    const feedback = qCard.querySelector(".feedback");
    let locked = false;

    question.options.forEach((optionText, optIndex) => {
      const btn = el(`
        <button type="button"
          class="quiz-option text-left px-4 py-3 rounded-xl border border-cream/25 bg-transparent hover:bg-cream/10 text-sm">
          ${optionText}
        </button>
      `);
      btn.addEventListener("click", () => {
        if (locked) return;
        locked = true;
        answered++;

        const isCorrect = optIndex === question.correct;
        if (isCorrect) correctCount++;

        [...optsWrap.children].forEach((b, i) => {
          b.classList.remove("hover:bg-cream/10");
          b.disabled = true;
          if (i === question.correct) {
            b.classList.add("bg-correct/80", "border-correct", "text-cream");
          } else if (i === optIndex && !isCorrect) {
            b.classList.add("bg-wrong/80", "border-wrong", "text-cream");
          } else {
            b.classList.add("opacity-50");
          }
        });

        feedback.classList.remove("hidden");
        feedback.textContent = isCorrect
          ? "Certo! Boa."
          : `Errado. A resposta correta é: ${question.options[question.correct]}`;
        feedback.classList.add(isCorrect ? "text-correct" : "text-wrong");

        if (answered === questions.length) {
          scoreBox.classList.remove("hidden");
          scoreBox.innerHTML = `
            <p class="font-display text-xl">${correctCount} de ${questions.length} corretas</p>
            <p class="text-cream/60 text-sm mt-1">Revise o conteúdo acima nos pontos que errou.</p>
          `;
        }
      });
      optsWrap.appendChild(btn);
    });

    list.appendChild(qCard);
  });

  if (questions.length === 0) {
    list.appendChild(el(`<p class="text-cream/60 text-sm">O treino deste conteúdo ainda será adicionado.</p>`));
  }

  return section;
}

   ============================================================ */
router();

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      /* instalação como PWA segue funcionando mesmo sem o service worker */
    });
  });
}
</script>
